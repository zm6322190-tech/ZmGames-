<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZM Games</title>
<style id="css">
:root{--bg:#f4f5fb;--card:#fff;--text:#14161f;--muted:#6b7080;--accent:#6c4cff;--accent2:#ff4fa3;--accent-t:#fff;--line:#e3e5ee;--danger:#d93a3a;--shadow:0 6px 22px rgba(60,40,140,.10);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f16;--card:#171a25;--text:#eceef6;--muted:#9a9fb2;--accent:#8b72ff;--accent2:#ff6fb5;--accent-t:#fff;--line:#2a2e3d;--danger:#ff6b6b;--shadow:0 6px 22px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0d0f16;--card:#171a25;--text:#eceef6;--muted:#9a9fb2;--accent:#8b72ff;--accent2:#ff6fb5;--accent-t:#fff;--line:#2a2e3d;--danger:#ff6b6b;--shadow:0 6px 22px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:36px 16px 56px;text-align:center;border-radius:0 0 28px 28px}
.logo{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.2);font-weight:800;font-size:26px;letter-spacing:1px;margin-bottom:10px;backdrop-filter:blur(6px)}
.hero h1{margin:0;font-size:32px;letter-spacing:.5px}
.hero p{margin:6px 0 0;opacity:.9}
.count{display:inline-block;margin-top:14px;background:rgba(255,255,255,.2);padding:4px 14px;border-radius:999px;font-size:14px}
.wrap{max-width:1000px;margin:-28px auto 0;padding:0 16px 40px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;background:var(--card);padding:10px;border-radius:16px;box-shadow:var(--shadow)}
button,.btn{font:inherit;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-t);text-decoration:none;display:inline-block;text-align:center;font-weight:600}
button.alt{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
button.del{background:transparent;color:var(--danger);border:1px solid var(--line);padding:8px 12px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:34px}
.bar+.grid,.bar+.empty{margin-top:0}
.card{background:var(--card);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--line);display:block}
.card .in{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{margin:0;font-size:19px}
.card p{margin:0;color:var(--muted);flex:1;white-space:pre-wrap;word-break:break-word;font-size:15px}
.empty{text-align:center;color:var(--muted);padding:60px 10px;margin-top:34px;background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.foot{margin-top:34px;text-align:center}
.foot button{font-size:13px;padding:6px 12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.modal h2{margin:0 0 8px;font-size:21px}
label.l{display:block;margin:12px 0 4px;font-size:14px;color:var(--muted)}
input,textarea{width:100%;font:inherit;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
textarea{min-height:90px;resize:vertical}
.pick{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border:2px dashed var(--accent);border-radius:14px;color:var(--accent);font-weight:600;overflow:hidden;text-align:center;padding:8px}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0;font-size:0}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1}
.prev{width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:8px}
.err{color:var(--danger);font-size:14px;margin-top:8px;min-height:20px}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted);margin-inline-end:6px}
.chip.v{color:var(--accent);border-color:var(--accent);font-weight:700}
.note{font-size:13px;background:var(--bg);border-radius:10px;padding:8px 10px;color:var(--text);white-space:pre-wrap;word-break:break-word}
.tools{display:flex;gap:6px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.tools button{padding:7px 11px;font-size:13px;flex:1;min-width:60px}
</style>
</head>

<script id="app">
const CODE = "19/7/2010";
let state;
try { state = JSON.parse(document.getElementById('data').textContent); } catch (e) { state = { games: [] }; }
if (!state || !Array.isArray(state.games)) state = { games: [] };
let admin = false;
try { admin = sessionStorage.getItem('gh_admin') === '1'; } catch (e) {}

const root = document.getElementById('root');
function el(tag, props, kids) {
  const n = document.createElement(tag);
  for (const k in (props || {})) {
    if (k === 'text') n.textContent = props[k];
    else if (k === 'class') n.className = props[k];
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), props[k]);
    else n.setAttribute(k, props[k]);
  }
  (kids || []).forEach(c => c && n.appendChild(c));
  return n;
}
function norm(s) {
  return String(s).trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[-.\\]/g, '/');
}
function safeUrl(u) {
  try { const x = new URL(u); return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : null; } catch (e) { return null; }
}
function buildDoc() {
  const css = document.getElementById('css').textContent;
  const js = document.getElementById('app').textContent;
  const data = JSON.stringify(state).replace(/</g, '\\u003c');
  const S = '<' + 'script', E = '<' + '/script>';
  return '<!DOCTYPE html>\n<html lang="ar" dir="rtl"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' +
    '<title>ZM Games</title><style id="css">' + css + '</style></head><body><div id="root"></div>' +
    S + ' type="application/json" id="data">' + data + E + S + ' id="app">' + js + E + '</body></html>';
}
async function save(prev) {
  try {
    const a = await claude.use('artifact');
    if (!a) throw new Error('no');
    await a.publish(buildDoc());
    return null;
  } catch (e) {
    state = prev;
    render();
    return (e && (e.code === 'not_writer' || e.code === 'not_granted' || e.message === 'no'))
      ? 'النشر لازم يتم من حساب صاحب الموقع على claude.ai' : 'حصلت مشكلة في الحفظ، جرّب تاني';
  }
}
function resizeImg(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, 640 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => rej(new Error('img'));
    img.src = u;
  });
}
function modal(content) {
  const ov = el('div', { class: 'ov' }, [el('div', { class: 'modal' }, content)]);
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  document.body.appendChild(ov);
  return ov;
}
function loginModal() {
  const inp = el('input', { type: 'password', placeholder: 'الرمز', autocomplete: 'off' });
  const err = el('div', { class: 'err' });
  const ov = modal([
    el('h2', { text: 'دخول المالك' }), inp, err,
    el('div', { class: 'row' }, [
      el('button', { text: 'دخول', onclick: () => {
        if (norm(inp.value) === norm(CODE)) {
          admin = true;
          try { sessionStorage.setItem('gh_admin', '1'); } catch (e) {}
          ov.remove(); render();
        } else err.textContent = 'الرمز غلط';
      } }),
      el('button', { class: 'alt', text: 'إلغاء', onclick: () => ov.remove() })
    ])
  ]);
  inp.focus();
}
function today() { try { return new Date().toLocaleDateString('ar-EG'); } catch (e) { return ''; } }
function confirmModal(text, onYes) {
  const ov = modal([
    el('h2', { text: text }),
    el('div', { class: 'row' }, [
      el('button', { text: 'أيوه', onclick: () => { ov.remove(); onYes(); } }),
      el('button', { class: 'alt', text: 'لا', onclick: () => ov.remove() })
    ])
  ]);
}
function gameModal(g, mode) {
  const isAdd = mode === 'add', isUpd = mode === 'update';
  let imgData = null;
  const name = el('input', { placeholder: 'اسم اللعبة', maxlength: '80' });
  const desc = el('textarea', { placeholder: 'وصف اللعبة', maxlength: '1000' });
  const apk = el('input', { type: 'url', placeholder: 'https://... رابط APK', dir: 'ltr' });
  const ver = el('input', { placeholder: 'رقم الإصدار (مثلا 1.2)', maxlength: '20' });
  const note = el('textarea', { placeholder: 'إيه الجديد في التحديث؟ (اختياري)', maxlength: '300' });
  if (g && !isUpd) { name.value = g.name; desc.value = g.desc || ''; apk.value = g.apk; ver.value = g.ver || ''; }
  const prev = el('img', { class: 'prev', style: 'display:none' });
  const file = el('input', { type: 'file', accept: 'image/*' });
  const pickTxt = el('span', { text: isAdd ? '📷 اضغط هنا واختار صورة من الموبايل' : '📷 تغيير الصورة (اختياري)' });
  const pick = el('div', { class: 'pick' }, [pickTxt, file]);
  const err = el('div', { class: 'err' });
  file.addEventListener('change', async () => {
    if (!file.files[0]) return;
    try { imgData = await resizeImg(file.files[0]); prev.src = imgData; prev.style.display = 'block'; err.textContent = ''; pickTxt.textContent = '✅ تم اختيار الصورة (اضغط لتغييرها)'; }
    catch (e) { err.textContent = 'مقدرتش أقرا الصورة'; }
  });
  const L = t => el('label', { class: 'l', text: t });
  const ok = el('button', { text: isUpd ? 'نشر التحديث' : (isAdd ? 'نشر اللعبة' : 'حفظ التعديل') });
  const fields = isUpd
    ? [el('h2', { text: 'تحديث: ' + g.name }), L('رابط الـ APK الجديد'), apk, L('رقم الإصدار الجديد'), ver, L('الجديد في التحديث'), note]
    : [el('h2', { text: isAdd ? 'إضافة لعبة' : 'تعديل: ' + g.name }), L('الاسم'), name, L('صورة اللعبة'), pick, prev, L('الوصف'), desc, L('رابط APK'), apk, L('رقم الإصدار'), ver];
  const ov = modal(fields.concat([err, el('div', { class: 'row' }, [ok, el('button', { class: 'alt', text: 'إلغاء', onclick: () => ov.remove() })])]));
  ok.addEventListener('click', async () => {
    const link = safeUrl(apk.value.trim());
    if (!isUpd && !name.value.trim()) { err.textContent = 'اكتب اسم اللعبة'; return; }
    if (isAdd && !imgData) { err.textContent = 'اختار صورة'; return; }
    if (!link) { err.textContent = 'رابط الـ APK مش صحيح'; return; }
    const label = ok.textContent;
    ok.disabled = true; ok.textContent = 'جاري النشر...';
    const prevState = JSON.parse(JSON.stringify(state));
    if (isAdd) {
      state.games.push({ id: Date.now().toString(36), name: name.value.trim(), desc: desc.value.trim(), img: imgData, apk: link, ver: ver.value.trim(), upd: '', note: '' });
    } else {
      const t = state.games.find(x => x.id === g.id);
      if (!t) { ov.remove(); return; }
      t.apk = link;
      if (isUpd) { if (ver.value.trim()) t.ver = ver.value.trim(); t.note = note.value.trim(); t.upd = today(); }
      else { t.name = name.value.trim(); t.desc = desc.value.trim(); t.ver = ver.value.trim(); if (imgData) t.img = imgData; }
    }
    const m = await save(prevState);
    if (m) { err.textContent = m; ok.disabled = false; ok.textContent = label; }
  });
}
function removeGame(g) {
  confirmModal('مسح "' + g.name + '"؟', async () => {
    const prevState = JSON.parse(JSON.stringify(state));
    state.games = state.games.filter(x => x.id !== g.id);
    const m = await save(prevState);
    if (m) modal([el('h2', { text: m }), el('div', { class: 'row' }, [el('button', { text: 'تمام', onclick: e => e.target.closest('.ov').remove() })])]);
  });
}
async function moveGame(g, d) {
  const i = state.games.findIndex(x => x.id === g.id), j = i + d;
  if (i < 0 || j < 0 || j >= state.games.length) return;
  const prevState = JSON.parse(JSON.stringify(state));
  const t = state.games[i]; state.games[i] = state.games[j]; state.games[j] = t;
  const m = await save(prevState);
  if (m) modal([el('h2', { text: m }), el('div', { class: 'row' }, [el('button', { text: 'تمام', onclick: e => e.target.closest('.ov').remove() })])]);
}
function render() {
  root.textContent = '';
  root.appendChild(el('div', { class: 'hero' }, [
    el('div', { class: 'logo', text: 'ZM' }),
    el('h1', { text: 'ZM Games' }),
    el('p', { text: 'حمّل ألعابك المفضلة مباشرة' }),
    el('div', { class: 'count', text: '🎮 ' + state.games.length + ' لعبة' })
  ]));
  const wrap = el('div', { class: 'wrap' });
  if (admin) {
    wrap.appendChild(el('div', { class: 'bar' }, [
      el('button', { text: '+ إضافة لعبة', onclick: () => gameModal(null, 'add') }),
      el('button', { class: 'alt', text: 'خروج', onclick: () => { admin = false; try { sessionStorage.removeItem('gh_admin'); } catch (e) {} render(); } })
    ]));
  }
  if (!state.games.length) {
    wrap.appendChild(el('div', { class: 'empty', text: 'لسه مفيش ألعاب منشورة' }));
  } else {
    const grid = el('div', { class: 'grid' });
    state.games.forEach(g => {
      const im = el('img', { alt: g.name, loading: 'lazy' });
      if (typeof g.img === 'string' && g.img.startsWith('data:image/')) im.src = g.img;
      const href = safeUrl(g.apk);
      const kids = [];
      const meta = el('div', {});
      if (g.ver) meta.appendChild(el('span', { class: 'chip v', text: 'v' + String(g.ver).replace(/^v/i, '') }));
      if (g.upd) meta.appendChild(el('span', { class: 'chip', text: '🔄 آخر تحديث: ' + g.upd }));
      if (meta.childNodes.length) kids.push(meta);
      if (g.note) kids.push(el('div', { class: 'note', text: '✨ ' + g.note }));
      if (href) kids.push(el('a', { class: 'btn', href: href, target: '_blank', rel: 'noopener noreferrer', text: '⬇ تحميل APK' }));
      if (admin) kids.push(el('div', { class: 'tools' }, [
        el('button', { text: '🔄 تحديث', onclick: () => gameModal(g, 'update') }),
        el('button', { class: 'alt', text: '✏️ تعديل', onclick: () => gameModal(g, 'edit') }),
        el('button', { class: 'alt', text: '▲', onclick: () => moveGame(g, -1) }),
        el('button', { class: 'alt', text: '▼', onclick: () => moveGame(g, 1) }),
        el('button', { class: 'del', text: 'مسح', onclick: () => removeGame(g) })
      ]));
      grid.appendChild(el('div', { class: 'card' }, [
        im, el('div', { class: 'in' }, [el('h3', { text: g.name }), el('p', { text: g.desc || '' })].concat(kids))
      ]));
    });
    wrap.appendChild(grid);
  }
  if (!admin) wrap.appendChild(el('div', { class: 'foot' }, [el('button', { class: 'alt', text: '🔒 دخول المالك', onclick: loginModal })]));
  root.appendChild(wrap);
}
render();
</script>
</body>
</html>
